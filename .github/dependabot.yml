"updates":
- "directories":
  - "**/*"
  "groups":
    "go-minor-patch":
      "update-types":
      - "minor"
      - "patch"
    "go-testing":
      "patterns":
      - "github.com/stretchr/testify"
      - "github.com/golang/mock"
      - "go.uber.org/mock"
  "open-pull-requests-limit": 10
  "package-ecosystem": "gomod"
  "schedule":
    "interval": "weekly"
- "directories":
  - "**/*"
  "groups":
    "anchor":
      "patterns":
      - "anchor-*"
    "rust-minor-patch":
      "update-types":
      - "minor"
      - "patch"
    "serde":
      "patterns":
      - "serde*"
    "solana":
      "patterns":
      - "solana-*"
      - "spl-*"
    "tokio":
      "patterns":
      - "tokio*"
  "open-pull-requests-limit": 10
  "package-ecosystem": "cargo"
  "schedule":
    "interval": "weekly"
"version": 2
